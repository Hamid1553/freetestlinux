
name: Ubuntu Desktop Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: 1. Enable Remote Desktop & Firewall
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies xrdp

          sudo systemctl enable xrdp
          sudo systemctl start xrdp

          sudo adduser xrdp ssl-cert || true

          echo "XFCE Desktop and xRDP installed."

      - name: 2. Create Admin Account
        run: |
          sudo useradd -m -s /bin/bash NvDAdmin || true

          echo "NvDAdmin:P@ssw0rd1qazXSW@#" | sudo chpasswd

          sudo usermod -aG sudo NvDAdmin

          echo "startxfce4" | sudo tee /home/NvDAdmin/.xsession
          sudo chown NvDAdmin:NvDAdmin /home/NvDAdmin/.xsession
          sudo chmod +x /home/NvDAdmin/.xsession

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

        run: |
          # Download and install Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh

          # Connect to Tailscale network
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="github-linux-rdp"

          sleep 8

          # Get Tailscale IP
          ts_ip=$(sudo tailscale ip -4)

          echo ""
          echo "=================================================="
          echo "  >>> UBUNTU DESKTOP SERVER IS READY! <<<"
          echo "=================================================="
          echo "  Tailscale IP : $ts_ip"
          echo "  Username     : NvDAdmin"
          echo "  Password     : P@ssw0rd1qazXSW@#"
          echo "  >> Open mstsc and connect to: $ts_ip"
          echo "=================================================="

      - name: 4. Keep Server Alive (48 Hours)
        run: |
          for i in $(seq 1 2880); do
            sleep 60
            echo "[$i/2880] Ubuntu Desktop running..."
          done
